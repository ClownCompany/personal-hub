version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint does not support TS 7 yet (typescript-eslint#10940)
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
